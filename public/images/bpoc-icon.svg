<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="petalGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5a0"/>
      <stop offset="100%" stop-color="#1a3fa8"/>
    </radialGradient>
  </defs>
  <!-- 12 petals arranged in a circle -->
  <g transform="translate(50,50)">
    <ellipse rx="8" ry="18" fill="url(#petalGrad)" opacity="0.92" transform="rotate(0) translate(0,-26)"/>
    <ellipse rx="8" ry="18" fill="url(#petalGrad)" opacity="0.92" transform="rotate(30) translate(0,-26)"/>
    <ellipse rx="8" ry="18" fill="url(#petalGrad)" opacity="0.92" transform="rotate(60) translate(0,-26)"/>
    <ellipse rx="8" ry="18" fill="url(#petalGrad)" opacity="0.92" transform="rotate(90) translate(0,-26)"/>
    <ellipse rx="8" ry="18" fill="url(#petalGrad)" opacity="0.92" transform="rotate(120) translate(0,-26)"/>
    <ellipse rx="8" ry="18" fill="url(#petalGrad)" opacity="0.92" transform="rotate(150) translate(0,-26)"/>
    <ellipse rx="8" ry="18" fill="url(#petalGrad)" opacity="0.92" transform="rotate(180) translate(0,-26)"/>
    <ellipse rx="8" ry="18" fill="url(#petalGrad)" opacity="0.92" transform="rotate(210) translate(0,-26)"/>
    <ellipse rx="8" ry="18" fill="url(#petalGrad)" opacity="0.92" transform="rotate(240) translate(0,-26)"/>
    <ellipse rx="8" ry="18" fill="url(#petalGrad)" opacity="0.92" transform="rotate(270) translate(0,-26)"/>
    <ellipse rx="8" ry="18" fill="url(#petalGrad)" opacity="0.92" transform="rotate(300) translate(0,-26)"/>
    <ellipse rx="8" ry="18" fill="url(#petalGrad)" opacity="0.92" transform="rotate(330) translate(0,-26)"/>
  </g>
</svg>
